<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 智慧客服測試平台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 頂部列 -->
  <div class="topbar">
    <img 
      src="https://raw.githubusercontent.com/justin-321-hub/taipei_marathon_AI_Test/refs/heads/main/assets/logo.png" 
      alt="Logo" 
      class="logo"
    />
    <div class="brand">
      <div class="title">AI 智慧客服測試平台</div>
      <div class="subtitle">Taipei Marathon AI Testing Tool</div>
    </div>
  </div>

  <!-- 主體區域 -->
  <div class="main">
    <!-- 訊息區域 -->
    <div id="messages" class="messages"></div>

    <!-- 思考中 -->
    <div id="thinking" class="thinking hidden">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span>客服正在思考 快出來了!</span>
    </div>
  </div>

  <!-- 輸入列 -->
  <div class="composer">
    <!-- API 選擇下拉選單 (新增) -->
    <select id="apiSelect" class="api-select">
      <option value="https://taipei-marathon-ai-test-server.onrender.com">🧪 台北馬測試</option>
      <option value="https://taipei-marathon-server.onrender.com">🏃 台北馬正式</option>
      <option value="https://taipei-101-run-up-server-test.onrender.com">🏃 垂直馬測試</option>
      <option value="https://taipei-101-run-up-server.onrender.com">🏃 垂直馬正式</option>
    </select>

    <!-- 語言選擇下拉選單 -->
    <select id="langSelect" class="lang-select">
      <option value="繁體中文">🇹🇼 中文</option>
      <option value="英文">🇬🇧 English</option>
    </select>

    <!-- 檔案上傳 (hidden) -->
    <input type="file" id="fileInput" accept=".txt" style="display: none;" />

    <!-- 上傳按鈕 -->
    <button id="btnUpload" class="btn btn-outline">📤 上傳</button>

    <!-- 輸入框 -->
    <textarea 
      id="txtInput" 
      class="input" 
      placeholder="請輸入您的問題..."
      rows="1"
    ></textarea>

    <!-- 送出按鈕 -->
    <button id="btnSend" class="btn btn-primary">送出</button>

    <!-- 中斷按鈕 -->
    <button id="btnStop" class="btn btn-outline" disabled>⏸️ 中斷</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
