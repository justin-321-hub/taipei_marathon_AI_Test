<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台北馬拉松智慧客服 — Taipei Marathon AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 頂部列 -->
  <header class="topbar">
    <img class="logo" 
         src="https://raw.githubusercontent.com/justin-321-hub/taipei_marathon/refs/heads/main/assets/logo.png" 
         alt="Logo">
    <div class="brand">
      <div class="title">台北馬拉松智慧客服</div>
      <div class="subtitle">Taipei Marathon Smart Service</div>
    </div>
  </header>

  <!-- 主體 -->
  <main class="main">
    <!-- 訊息清單 -->
    <div id="messages" class="messages"></div>

    <!-- 思考中動畫 -->
    <div id="thinking" class="thinking hidden">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span style="margin-left:4px;">客服正在思考 快出來了!</span>
    </div>
  </main>

  <!-- 輸入列 -->
  <div class="composer">
    <textarea id="txtInput" class="input" placeholder="請輸入您的問題..." rows="1"></textarea>

    <!-- 隱藏的文件輸入 -->
    <input type="file" id="fileInput" accept=".txt" style="display: none;">

    <!-- 上傳按鈕 -->
    <button id="btnUpload" class="btn btn-primary" title="上傳txt文本批次提問">
      📤 上傳
    </button>

    <!-- 送出按鈕 -->
    <button id="btnSend" class="btn btn-primary">送出</button>

    <!-- 中斷按鈕 -->
    <button id="btnStop" class="btn btn-primary" disabled title="中斷批次處理">
      ⏸️ 中斷
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
